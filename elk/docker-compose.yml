# docker-compose.yml
#
# ELK stack (Elasticsearch, Logstash, Kibana) for the original detection
# pipeline plan described in Section 6.4 of the dissertation. Logstash mounts
# logstash.conf and ../data (the captured traffic CSVs) as its pipeline input.
#
# Lab use only: security is disabled so the stack runs without certificates.
# Do not expose these ports outside an isolated test machine.
#
#   cd elk && docker compose up -d

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: logstash
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - ../data:/usr/share/logstash/data_input
    depends_on:
      - elasticsearch

volumes:
  esdata:
