# logstash.conf
#
# MSc Cybersecurity Dissertation
# Evaluating Machine Learning Approaches for Anomaly Detection in OT Network Traffic
# Dewanshi Manoj Agarkar
#
# ------------------------------------------------------------------------------
# PURPOSE
# ------------------------------------------------------------------------------
# Logstash pipeline configuration for ingesting captured Modbus traffic CSVs
# into Elasticsearch, as part of the original ELK-based detection plan
# described in Section 6.4. This is the corrected configuration reached
# after debugging the sincedb duplicate-ingestion issue and the hardcoded
# attack_type field bug (see Section 6.4 for the full account, including
# why ingestion was ultimately still not reliable enough to depend on, and
# the pivot to running detection scripts directly against these CSVs).
# ------------------------------------------------------------------------------

input {
  file {
    path => "/usr/share/logstash/data_input/*.csv"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data_input/.sincedb"
  }
}
filter {
  csv {
    separator => ","
    quote_char => '"'
    columns => ["frame_time_epoch", "ip_src", "ip_dst", "modbus_func_code", "modbus_reference_num", "modbus_regval_uint16"]
    skip_header => true
  }
  mutate {
    convert => {
      "frame_time_epoch" => "float"
      "modbus_func_code" => "integer"
      "modbus_reference_num" => "integer"
      "modbus_regval_uint16" => "integer"
    }
  }
  if [log][file][path] =~ "attack1_writes" {
    mutate { add_field => { "attack_type" => "false_data_injection" } }
  } else if [log][file][path] =~ "replay_writes" {
    mutate { add_field => { "attack_type" => "replay" } }
  } else if [log][file][path] =~ "protocol_abuse_writes" {
    mutate { add_field => { "attack_type" => "protocol_abuse" } }
  }
  date {
    match => ["frame_time_epoch", "UNIX"]
    target => "@timestamp"
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "modbus-attacks"
  }
  stdout { codec => rubydebug }
}